overrides:
  "dompurify@<=3.4.10": "^3.4.11"
  "postcss@<8.5.10": "^8.5.10"
  "@hono/node-server@<1.19.13": "^1.19.13"
  "hono@<4.12.25": "^4.12.25"
  "picomatch@<4.0.4": "^4.0.4"
  "body-parser@<2.3.0": "^2.3.0"
  "fast-uri@<3.1.5": "^3.1.5"
  # Address4 decoded leading-zero octets as decimal, so `010.0.0.1` parsed as
  # 10.0.0.1 rather than being rejected. That is the exact alt-notation class
  # `isPublicUrl` exists to catch, and this copy arrives under the MCP SDK's
  # rate limiter where nothing of ours screens it.
  "ip-address@<10.3.1": "^10.3.1"
  "sharp@<0.35.0": "^0.35.3"

allowBuilds:
  "@prisma/engines": true
  prisma: true
  core-js: false
  cpu-features: false
  esbuild: false
  lefthook: false
  msw: false
  protobufjs: false
  sharp: false
  ssh2: false
  tesseract.js: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - "@next/bundle-analyzer@16.2.12"
  - lucide-react@1.27.0
  - "@openai/codex-security@0.1.1"
  - undici@8.10.0
